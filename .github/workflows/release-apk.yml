name: Build & Release DeepOS APKs (sdk28 + sdk36)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.0.0; leave empty to use v<version_name>-<run_number>)'
        required: false
        default: ''
      version_name:
        description: 'App version name (e.g. 2.0.0)'
        required: false
        default: '2.0.0'
      publish_release:
        description: 'Create/update a GitHub Release with both sdk28 and sdk36 APKs'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  build-release-apks:
    name: Build sdk28 & sdk36 Release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android NDK & CMake
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Configure release signing (optional secrets)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "${KEYSTORE_B64:-}" ]]; then
            echo "$KEYSTORE_B64" | base64 -d > app/android/release.keystore
            printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASS" "$KEY_ALIAS" "$KEY_PASS" > app/android/key.properties
            echo "Configured release keystore signing."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret configured; falling back to default debug signing."
          fi

      - name: Resolve version & build number
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VER="${TAG#v}"
            VER="${VER%%-*}"
          else
            VER="${{ inputs.version_name }}"
            TAG="${{ inputs.tag }}"
            if [[ -z "$TAG" ]]; then
              TAG="v${VER}-deepos.${GITHUB_RUN_NUMBER}"
            fi
          fi
          BUILD_NUM=$(python3 tooling/build_number.py)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "build_num=$BUILD_NUM" >> "$GITHUB_OUTPUT"
          echo "Resolved: tag=$TAG version=$VER build_num=$BUILD_NUM"

      - name: Run verification checks
        run: |
          node tooling/test-gateway.mjs a0610-b2-sessionops ccmem.test a0610-b2-state-shapes
          (cd packages/cc_gateway_client && dart pub get && dart analyze && dart test)
          python3 app/tool/l10n_merge.py --check
          (cd app && flutter pub get && flutter analyze lib/ && flutter test)

      - name: Build sdk28 & sdk36 Release APKs
        working-directory: app
        env:
          DSH_MAVEN_MIRRORS: '0'
        run: |
          flutter build apk --release --flavor sdk28 --target-platform android-arm64 \
            --build-number "${{ steps.ver.outputs.build_num }}" \
            --build-name "${{ steps.ver.outputs.version }}" \
            --android-skip-build-dependency-validation
          flutter build apk --release --flavor sdk36 --target-platform android-arm64 \
            --build-number "${{ steps.ver.outputs.build_num }}" \
            --build-name "${{ steps.ver.outputs.version }}" \
            --android-skip-build-dependency-validation

      - name: Verify APK native libs & compute checksums
        run: |
          VER="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-sdk28-release.apk "dist/DeepOS-${VER}-sdk28.apk"
          cp app/build/app/outputs/flutter-apk/app-sdk36-release.apk "dist/DeepOS-${VER}-sdk36.apk"
          python3 tooling/check_apk_jni.py "dist/DeepOS-${VER}-sdk28.apk" "dist/DeepOS-${VER}-sdk36.apk"
          (cd dist && sha256sum "DeepOS-${VER}-sdk28.apk" "DeepOS-${VER}-sdk36.apk" > SHA256SUMS)
          ls -lh dist/
          cat dist/SHA256SUMS

      - name: Upload Release APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeepOS-${{ steps.ver.outputs.version }}-APKs
          path: dist/
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          VER="${{ steps.ver.outputs.version }}"
          BUILD_NUM="${{ steps.ver.outputs.build_num }}"
          APK28="dist/DeepOS-${VER}-sdk28.apk"
          APK36="dist/DeepOS-${VER}-sdk36.apk"
          printf '%s\n' \
            "DeepOS v2 — Android 原生免 PRoot Claude Code 端侧开发工作站（融合 [dsh-Go](https://github.com/ccch1mneyyy/dsh-Go) 与 [cccodroid](https://github.com/greyoak111/cccodroid)，AGPL-3.0）。" \
            "" \
            "- **版本**：\`${VER}\`（build \`${BUILD_NUM}\`）" \
            "- **包名**：\`app.deepos\`（10 字符等长包名，原生免 PRoot 执行 Termux 工具包）" \
            "- **安装包选择**：" \
            "  - \`DeepOS-${VER}-sdk28.apk\`：常规版（targetSdk 28，适用大多数机型）" \
            "  - \`DeepOS-${VER}-sdk36.apk\`：新系统版（targetSdk 36，若系统提示不兼容旧版 SDK 请装此包）" \
            "- **首次启动**：按需下载模块化工具包及官方原版 Claude Code（APK 不含专有二进制）" \
            "- **校验**：见附件 \`SHA256SUMS\`" > dist/RELEASE_NOTES.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK28" "$APK36" dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" "$APK28" "$APK36" dist/SHA256SUMS \
              --title "DeepOS ${TAG} (sdk28 + sdk36)" \
              --notes-file dist/RELEASE_NOTES.md
          fi
