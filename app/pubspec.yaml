name: deepos_app
description: "DeepOS — Native Flutter Android workstation powered by Claude Code (No-PRoot)"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  gpt_markdown: ^1.4.0
  val_latex_flutter: ^0.1.3
  re_highlight: ^0.0.3
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  cc_gateway_client:
    path: ../packages/cc_gateway_client
  scrollable_positioned_list: ^0.3.8
  share_plus: ^13.3.1
  file_picker: ^13.1.0
  crypto: ^3.0.7
  xterm: ^4.0.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.2
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  fonts:
    - family: DshIcons
      fonts:
        - asset: assets/fonts/DshIcons.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Italic.ttf
          style: italic
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
